<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LNGSHOT | warren.my.id</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;}

  #float{
    position:fixed;right:16px;bottom:24px;z-index:9999;
    border:1px solid #ffffff35;background:#202020;
    color:white;border-radius:30px;padding:12px 17px;
    box-shadow:0 4px 20px #0009;cursor:pointer;
    font-size:14px;
  }
  #float:active{transform:scale(.96)}

  #panel{
    display:none;position:fixed;z-index:10000;
    right:14px;bottom:80px;width:min(330px,calc(100% - 28px));
    background:#191919;border:1px solid #444;
    border-radius:17px;padding:18px;
    box-shadow:0 10px 40px #000b;
    color:#fff;
  }
  #panel.show{display:block}
  #close{float:right;background:none;color:white;border:0;font-size:22px;cursor:pointer}
  .code{font-size:36px;font-weight:bold;letter-spacing:8px;
    text-align:center;margin:22px 0;min-height:44px;display:flex;align-items:center;justify-content:center}
  .spin{width:26px;height:26px;border:3px solid #444;border-top-color:#0a84ff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{font-size:13px;line-height:1.6;color:#bbb}
  .warn{font-size:11.5px;line-height:1.5;color:#ff9f0a;margin-top:10px}
  small{color:#888}
  button{cursor:pointer}

  #footer{
    position:fixed;left:0;right:0;bottom:0;z-index:9998;
    text-align:center;padding:8px 10px;
    font-size:11px;color:#8e8e93;
    background:linear-gradient(transparent,rgba(0,0,0,.55) 60%);
    pointer-events:none;
  }
  #footer a{color:#8e8e93;pointer-events:auto;text-decoration:none}
  #footer a:hover{color:#fff}
</style>
</head>
<body>
<iframe id="frame" src="/source/" allow="autoplay"></iframe>

<button id="float" onclick="toggle()">
  <svg id="lockicon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px">
    <rect id="lockbody" x="4" y="11" width="16" height="10" rx="2"></rect>
    <path id="lockshackle" d="M8 11V7a4 4 0 0 1 8 0v4"></path>
  </svg>
  Passcode
</button>

<div id="panel">
  <button id="close" onclick="toggle()">×</button>
  <small>LIVE PASSCODE</small>
  <div class="code" id="code">----</div>
  <div class="hint" id="hint">Memuat informasi...</div>
  <p><small id="clock"></small></p>
  <div class="warn" id="warn"></div>
  <p style="text-align:center;margin:10px 0 2px;font-size:11px;color:#8e8e93"><a href="https://www.warren.my.id" target="_blank" rel="noopener" style="color:#8e8e93;text-decoration:none">warren.my.id</a> | <a href="https://github.com/warrenku/lngshot" target="_blank" rel="noopener" style="color:#8e8e93;text-decoration:none">source</a></p>

</div>



<div id="footer"><a href="https://www.warren.my.id" target="_blank" rel="noopener">www.warren.my.id</a> · <a href="https://github.com/warrenku/lngshot" target="_blank" rel="noopener">Source</a></div>

<script>
function toggle(){
  const open = document.getElementById('panel').classList.toggle('show');
  document.getElementById('lockshackle').setAttribute('d', open ? 'M8 11V7a4 4 0 0 1 7.6-1.8' : 'M8 11V7a4 4 0 0 1 8 0v4');
}

// ====== reimplementasi pola passcode dari source situs ======
const PASS_START  = Date.parse('2026-10-27T11:00:00+07:00');
const PASS_STEP0  = 30 * 60 * 1000;
const PASS_START2 = Date.parse('2026-10-27T13:30:00+07:00');
const PASS_STEP   = 45 * 60 * 1000;
const PASSES = [
['Kode diperbarui: di menit ke berapa OHYUL bertemu dengan merak dengan posisi menghadap kamera pada music video LNGSHOT yang berjudul "MASTERPIECE"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0142'],
['Kode diperbarui: di menit ke berapa OHYUL memasuki lift pada music video LNGSHOT yang berjudul "MASTERPIECE"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0154'],
['Kode diperbarui: menit ke berapa 3 member LNGSHOT menari di belakang WOOJIN di kegelapan pada music video LNGSHOT yang berjudul "MASTERPIECE"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0246'],
['Kode diperbarui: di menit ke berapa RYUL menyelesaikan rap pertamanya pada music video LNGSHOT yang berjudul "MOONWALKIN"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0050'],
['Kode diperbarui: di menit ke berapa LOUIS menyelesaikan part pertamanya pada music video LNGSHOT yang berjudul "MOONWALKIN"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0101'],
['Kode diperbarui: di menit ke berapa OHYUL menyanyikan part "Haleluya" pada music video LNGSHOT yang berjudul "MOONWALKIN"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0208'],
['Kode diperbarui: di menit ke berapa LOUIS menyelesaikan chorus terakhirnya pada music video LNGSHOT yang berjudul "MOONWALKIN"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0259'],
['Kode diperbarui: di menit ke berapa RYUL menyelesaikan part terakhirnya pada music video LNGSHOT yang berjudul "NEVER LET GO - VISUALIZER"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0303'],
['Kode diperbarui: di menit ke berapa OHYUL selesai menyanyikan chorus pada music video LNGSHOT yang berjudul "NEVER LET GO - VISUALIZER"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0244'],
["Kode diperbarui: menit ke berapa RYUL membawakan lirik \"RYUL STYLE\" pada rap dia di music video LNGSHOT yang berjudul \"SAUCIN'\"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).",'0231'],
["Kode diperbarui: di menit ke berapa WOOJIN menyelesaikan part terakhirnya pada music video LNGSHOT yang berjudul \"SAUCIN'\"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).",'0258'],
['Kode diperbarui: kapan OHYUL upload foto dirinya dengan RYUL di Berlin?','0810'],
['Kode diperbarui: di menit ke berapa karakter LEE JUNYOUNG di WEAK HERO CLASS 2 dimention di lagunya yang berjudul "MR. CLEAN"? (tonton di youtube dan <b>JANGAN SEBARKAN PASSCODE</b>).','0159'],
['Kode diperbarui: apa lagu yang RYUL ciptakan dengan RYUL dan OHYUL yang menyanyikan part awal lagu tersebut di MIXTAPE2 4SHOVILLE?','6692'],
['Kode diperbarui: berapa tanggal lahir dari karakter yang dimainkan LEE JUNYOUNG WEAK HERO CLASS 2?','1304'],
];

let SRV_OFF = 0;
const nowMs = () => Date.now() + SRV_OFF;

const SHUFFLE_SALT = 20261027;
const PASS_N  = PASSES.length;
const PASS_N0 = Math.round((PASS_START2 - PASS_START) / PASS_STEP0);
const PASS_C0_END = PASS_START2 + (PASS_N - PASS_N0) * PASS_STEP;
const PASS_STEP2 = 2 * 60 * 60 * 1000;
const PASS_CYCLE = PASS_N * PASS_STEP2;

let sourceVid = (() => {
  try {
    const value = localStorage.getItem('vid_source');
    if (!value || !/^[1-9]\d{0,9}$/.test(value)) return null;
    const vid = Number(value);
    return vid <= 0xFFFFFFFF ? vid : null;
  } catch (e) {
    return null;
  }
})();
let VID = sourceVid || 1;
let sourceFrameError = '';

function readSourcePass() {
  try {
    const sourceWindow = document.getElementById('frame').contentWindow;
    if (typeof sourceWindow.curPass !== 'function') {
      sourceFrameError = 'Fungsi passcode situs sumber belum tersedia.';
      return null;
    }

    const pass = sourceWindow.curPass();
    const vidValue = sourceWindow.localStorage.getItem('vid');
    const vid = Number(vidValue);
    if (!pass || typeof pass.code !== 'string' || !/^\d{4}$/.test(pass.code) ||
        typeof pass.hint !== 'string' || !vidValue ||
        !/^[1-9]\d{0,9}$/.test(vidValue) || vid > 0xFFFFFFFF) {
      sourceFrameError = 'Halaman sumber memberi data passcode atau VID dengan format tidak valid.';
      return null;
    }

    sourceVid = vid;
    sourceFrameError = '';
    try { localStorage.setItem('vid_source', String(vid)) } catch (e) {}
    return { ...pass, vid };
  } catch (error) {
    sourceFrameError = 'Belum bisa membaca halaman sumber: ' + error.message;
    return null;
  }
}

function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let ORD = [Array.from({ length: PASS_N }, (_, i) => i)];
function passOrder(c) {
  while (ORD.length <= c) {
    const n = ORD.length;
    const r = rng((Math.imul(n ^ VID, 2654435761) ^ SHUFFLE_SALT) >>> 0);
    const a = ORD[0].slice();
    const prevLast = ORD[n - 1][PASS_N - 1];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    if (a[0] === prevLast) [a[0], a[1]] = [a[1], a[0]];
    ORD.push(a);
  }
  return ORD[c];
}

function passIndex(t) {
  if (t < PASS_START2) return Math.max(0, Math.floor((t - PASS_START) / PASS_STEP0));
  if (t < PASS_C0_END) return PASS_N0 + Math.floor((t - PASS_START2) / PASS_STEP);
  const d = t - PASS_C0_END, c = 1 + Math.floor(d / PASS_CYCLE), pos = Math.floor((d % PASS_CYCLE) / PASS_STEP2);
  return passOrder(c)[pos];
}

function curPass() {
  const t = nowMs();
  const idx = passIndex(t);
  const r = PASSES[idx] || PASSES[0];
  return { code: r[1], hint: r[0], phase: t < PASS_START2 ? 1 : (t < PASS_C0_END ? 2 : 3) };
}

// coba sinkron waktu server (diam-diam gagal kalau diblok CORS)
(async () => {
  try {
    const res = await fetch('https://lngshot-au-unknown.rinai.workers.dev/', { method: 'HEAD', cache: 'no-store', mode: 'cors' });
    const d = Date.parse(res.headers.get('Date'));
    if (d) SRV_OFF = d - Date.now();
  } catch (e) {}
})();

async function fetchLive(vid) {
  if (!vid) return null;
  const requestedVid = vid;
  try {
    const r = await fetch('/api/passcode?vid=' + requestedVid, { cache: 'no-store' });
    if (!r.ok) return null;
    const d = await r.json();
    return !d.error && d.vid === requestedVid && sourceVid === requestedVid ? d : null;
  } catch (e) {
    return null;
  }
}

let firstLoad = true;
async function render() {
  if (firstLoad) {
    document.getElementById('code').innerHTML = '<div class="spin"></div>';
    document.getElementById('hint').textContent = 'Mencari passcode terbaru...';
  }
  const sourcePass = readSourcePass();
  const live = sourcePass ? null : await fetchLive(sourceVid);
  firstLoad = false;
  const result = sourcePass || live || curPass();
  const { code, hint } = result;
  const phase = result.phase || curPass().phase;

  document.getElementById('code').textContent = code.split('').join(' ');
  const hintElement = document.getElementById('hint');
  hintElement.innerHTML = hint;
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('id-ID')
    + (sourcePass
      ? ' · tersinkron · VID ' + sourcePass.vid
      : ' · fase ' + phase + ' · ' + (live ? 'VID ' + live.vid + (live.stale ? ' · cache' : ' · API') : 'lokal'));
  if (sourcePass) {
    document.getElementById('warn').textContent = 'Kode dan hint dibaca langsung dari curPass() situs sumber pada perangkat ini.';
  } else if (sourceFrameError) {
    document.getElementById('warn').textContent = sourceFrameError + (sourceVid ? ' Memakai API sebagai fallback.' : ' Pastikan source proxy aktif dan muat ulang halaman.');
  } else if (!live) {
    document.getElementById('warn').textContent = 'API tidak terjangkau; memakai perhitungan lokal yang mungkin tidak sinkron.';
  } else if (live.stale) {
    document.getElementById('warn').textContent = 'Situs sumber sedang tidak bisa diperbarui. API memakai data terakhir yang berhasil diambil pada ' + new Date(live.source_checked).toLocaleString('id-ID') + '.';
  } else {
    document.getElementById('warn').textContent = phase === 3
      ? 'Kode dihitung oleh API menggunakan VID situs sumber yang dimasukkan.'
      : '';
  }
}

render();
setInterval(render, 5000);
</script>
